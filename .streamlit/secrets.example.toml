[angel_one]
# Copy this file to .streamlit/secrets.toml locally or set these values in your
# deployment provider's secrets manager. Never commit real credentials.
api_key = "your_angel_one_api_key"
client_secret = "your_angel_one_client_secret"
client_id = "your_angel_one_client_id"
password = "your_angel_one_pin_or_password"
totp_token = "your_angel_one_totp_secret"

[access]
# Use "mock" for local testing. Switch to "razorpay" after the Razorpay plan/API setup is ready.
mode = "mock"
demo_email = "demo@marketpulse.ai"
demo_password = "marketpulse-demo"
payment_url = "https://rzp.io/l/your-marketpulse-trial-link"
razorpay_key_id = "your_razorpay_key_id"
razorpay_key_secret = "your_razorpay_key_secret"
razorpay_plan_id = "your_razorpay_plan_id"
